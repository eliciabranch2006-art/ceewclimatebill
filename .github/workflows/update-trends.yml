name: Update trends data

on:
  schedule:
    - cron: "0 4 * * *"  # once a day at 04:00 UTC — increase frequency later if useful
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run trends update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        working-directory: scraper
        run: python update_trends.py

      - name: Commit updated data
        run: |
          git config user.name "ceew-bills-bot"
          git config user.email "actions@github.com"
          git add data/bills.db site/data/trends.json
          git diff --cached --quiet || git commit -m "Update trends data [automated]"
          git push
